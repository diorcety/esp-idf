name: Sync with upstream

on:
  schedule:
    # Check for upstream changes every hour
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync all branches and tags from upstream
        run: |
          git remote add upstream https://github.com/espressif/esp-idf.git
          git fetch upstream --tags --force

          # Push all upstream branches (force to overwrite diverged refs)
          git push origin refs/remotes/upstream/*:refs/heads/* --force

          # Push all tags
          git push origin --tags --force

          echo "✅ Sync complete"
