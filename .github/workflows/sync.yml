name: Sync with upstream

on:
  schedule:
    # Check for upstream changes every hour
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync all branches and tags from upstream
        run: |
          git remote add upstream https://github.com/espressif/esp-idf.git

          # Fetch everything from upstream
          git fetch upstream '+refs/heads/*:refs/remotes/upstream/*' '+refs/tags/*:refs/tags/*' --force

          # Push all branches
          git push origin '+refs/remotes/upstream/*:refs/heads/*' --force

          # Push all tags
          git push origin '+refs/tags/*:refs/tags/*' --force

          echo "✅ Sync complete"
