name: Mirror esp-idf Releases (strip .git)

on:
  schedule:
    # Check for new releases every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      release_count:
        description: 'Number of recent releases to check (ignored when backfill_all=true)'
        required: false
        default: '10'
      backfill_all:
        description: 'Backfill ALL releases, ignores release_count (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Discover which releases need mirroring
  # ─────────────────────────────────────────────────────────────
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Fetch upstream releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKFILL: ${{ github.event.inputs.backfill_all }}
          RELEASE_COUNT: ${{ github.event.inputs.release_count || '10' }}
        run: |
          if [ "$BACKFILL" = "true" ]; then
            echo "Backfill mode: fetching ALL releases…"
            PAGE=1
            ALL_TAGS="[]"
            while true; do
              CHUNK=$(gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/espressif/esp-idf/releases?per_page=100&page=${PAGE}" \
                --jq '[.[].tag_name]')
              COUNT=$(echo "$CHUNK" | jq 'length')
              echo "Page $PAGE: $COUNT releases"
              ALL_TAGS=$(jq -n --argjson a "$ALL_TAGS" --argjson b "$CHUNK" '$a + $b')
              [ "$COUNT" -lt 100 ] && break
              PAGE=$((PAGE + 1))
            done
            echo "$ALL_TAGS" > /tmp/upstream_tags.json
          else
            echo "Normal mode: fetching last ${RELEASE_COUNT} releases…"
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/espressif/esp-idf/releases?per_page=${RELEASE_COUNT}&page=1" \
              --jq '[.[].tag_name]' > /tmp/upstream_tags.json
          fi
          echo "Upstream tags:"
          cat /tmp/upstream_tags.json

      - name: Fetch already-mirrored releases in this repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PAGE=1
          MIRRORED="[]"
          while true; do
            CHUNK=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${{ github.repository }}/releases?per_page=100&page=${PAGE}" \
              --jq '[.[].tag_name]' 2>/dev/null || echo "[]")
            COUNT=$(echo "$CHUNK" | jq 'length')
            MIRRORED=$(jq -n --argjson a "$MIRRORED" --argjson b "$CHUNK" '$a + $b')
            [ "$COUNT" -lt 100 ] && break
            PAGE=$((PAGE + 1))
          done
          echo "Already mirrored: $(echo "$MIRRORED" | jq 'length') releases"
          echo "$MIRRORED" > /tmp/mirrored_tags.json

      - name: Build job matrix
        id: build-matrix
        run: |
          UPSTREAM=$(cat /tmp/upstream_tags.json)
          MIRRORED=$(cat /tmp/mirrored_tags.json)

          PENDING=$(jq -n \
            --argjson u "$UPSTREAM" \
            --argjson m "$MIRRORED" \
            '[$u[] | select(. as $t | $m | index($t) | not)]')

          COUNT=$(echo "$PENDING" | jq 'length')
          echo "Releases to mirror: $COUNT"
          echo "$PENDING" | jq -r '.[]'

          if [ "$COUNT" -eq 0 ]; then
            MATRIX='{"include":[{"tag":"__none__"}]}'
          else
            MATRIX=$(jq -n --argjson p "$PENDING" '{include: [$p[] | {tag: .}]}')
          fi

          {
            echo "matrix<<MATRIX_EOF"
            echo "$MATRIX"
            echo "MATRIX_EOF"
          } >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────
  # 2. For each pending release: strip .git and republish
  # ─────────────────────────────────────────────────────────────
  mirror:
    needs: discover
    if: ${{ !contains(needs.discover.outputs.matrix, '__none__') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y jq

      - name: Fetch upstream release metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
        run: |
          DATA=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/espressif/esp-idf/releases/tags/${TAG}")

          echo "release_name=$(echo "$DATA" | jq -r '.name // empty')" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(echo "$DATA"   | jq -r '.prerelease')"     >> "$GITHUB_OUTPUT"

          echo "$DATA" | jq -r '.body // ""' > "$GITHUB_WORKSPACE/release_body.md"

      - name: Download tarball, strip .git, repack
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail

          # Use the exact same archive name GitHub generates so download URLs
          # are identical to upstream, only the repo prefix changes.
          BASENAME="esp-idf-${TAG}"
          TARBALL_URL="https://github.com/espressif/esp-idf/archive/refs/tags/${TAG}.tar.gz"

          mkdir -p "$GITHUB_WORKSPACE/work"
          cd "$GITHUB_WORKSPACE/work"

          echo "==> Downloading ${TAG}…"
          curl -fL "$TARBALL_URL" -o upstream.tar.gz

          echo "==> Extracting…"
          tar xzf upstream.tar.gz
          EXTRACTED_DIR=$(tar tzf upstream.tar.gz | head -1 | cut -d/ -f1)
          echo "Extracted dir: $EXTRACTED_DIR"

          echo "==> Stripping .git artifacts…"
          find "${EXTRACTED_DIR}" -name ".git"           -type d -exec rm -rf {} + 2>/dev/null || true
          find "${EXTRACTED_DIR}" -name ".gitmodules"    -type f -delete 2>/dev/null || true
          find "${EXTRACTED_DIR}" -name ".gitignore"     -type f -delete 2>/dev/null || true
          find "${EXTRACTED_DIR}" -name ".gitattributes" -type f -delete 2>/dev/null || true

          echo "==> Repacking as tar.gz…"
          tar czf "${BASENAME}.tar.gz" "${EXTRACTED_DIR}"

          echo "==> Repacking as zip…"
          zip -qr "${BASENAME}.zip" "${EXTRACTED_DIR}"

          echo "==> Sizes:"
          ls -lh "${BASENAME}.tar.gz" "${BASENAME}.zip"

          echo "BASENAME=${BASENAME}" >> "$GITHUB_ENV"
          echo "WORK_DIR=$GITHUB_WORKSPACE/work"   >> "$GITHUB_ENV"

      - name: Publish mirrored release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          cd "$WORK_DIR"

          printf '> Mirrored from [espressif/esp-idf@%s](https://github.com/espressif/esp-idf/releases/tag/%s). `.git` directory removed.\n\n---\n\n' \
            "$TAG" "$TAG" | cat - "$GITHUB_WORKSPACE/release_body.md" > "$GITHUB_WORKSPACE/full_body.md"

          # Delete existing release + tag in this repo (idempotent)
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          gh api --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/git/refs/tags/${TAG}" \
            2>/dev/null || true

          # Point new tag at the default branch HEAD
          DEFAULT_BRANCH=$(gh api "/repos/${{ github.repository }}" --jq '.default_branch')
          SHA=$(gh api "/repos/${{ github.repository }}/git/ref/heads/${DEFAULT_BRANCH}" --jq '.object.sha')
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/git/refs" \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${SHA}"

          PRERELEASE_FLAG=""
          [ "$PRERELEASE" = "true" ] && PRERELEASE_FLAG="--prerelease"

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "${RELEASE_NAME:-$TAG}" \
            --notes-file "$GITHUB_WORKSPACE/full_body.md" \
            $PRERELEASE_FLAG \
            "${BASENAME}.tar.gz" \
            "${BASENAME}.zip"

          echo "✅ Mirrored $TAG"
